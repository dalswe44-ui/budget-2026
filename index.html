<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 가계부 달력</title>
  <style>
    :root {
      --bg-color: #f7f6f2;
      --card-bg: #ffffff;
      --primary-green: #2ecc71;
      --primary-orange: #e67e22;
      --primary-blue: #3498db;
      --primary-red: #e74c3c;
      --primary-yellow: #d4ac0d;
      --primary-purple: #8e44ad;
      --text-main: #333333;
      --text-light: #7f8c8d;
      --border-color: #e0e0e0;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
    }

    .container { max-width: 1000px; margin: 0 auto; }

    /* 상단 요약 카드 */
    .summary-grid {
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); 
      gap: 15px; 
      margin-bottom: 30px;
    }
    .summary-card { background: var(--card-bg); padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .card-title { font-size: 0.85rem; color: var(--text-light); margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
    .edit-btn { cursor: pointer; font-size: 0.9rem; opacity: 0.5; transition: opacity 0.2s; }
    .edit-btn:hover { opacity: 1; }
    .card-amount { font-size: 1.3rem; font-weight: bold; margin-bottom: 5px; word-break: keep-all; }
    .card-desc { font-size: 0.75rem; color: #999; }

    .text-green { color: var(--primary-green); } 
    .text-orange { color: var(--primary-orange); }
    .text-blue { color: var(--primary-blue); } 
    .text-red { color: var(--primary-red); }
    .text-yellow { color: var(--primary-yellow); }
    .text-purple { color: var(--primary-purple); }

    /* 달력 컨트롤 & 범례 */
    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .calendar-header h2 { margin: 0; font-size: 1.5rem; }
    .btn-nav { background: white; border: 1px solid var(--border-color); padding: 8px 16px; border-radius: 8px; cursor: pointer; }
    .category-legend { display: flex; gap: 15px; margin-bottom: 15px; font-size: 0.85rem; flex-wrap: wrap; }
    .legend-item { display: flex; align-items: center; gap: 4px; }
    .legend-color { width: 10px; height: 10px; border-radius: 50%; border: 1px solid #ccc; }
    .cat-rent { border-color: var(--primary-orange); } .cat-utility { border-color: var(--primary-blue); background-color: #ebf5fb; }
    .cat-food { border-color: var(--primary-yellow); } .cat-supplies { border-color: var(--primary-purple); }
    .cat-move { border-color: var(--primary-red); } .cat-etc { border-color: var(--primary-green); }

    /* 달력 그리드 */
    .calendar-grid { background: var(--card-bg); border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); overflow: hidden; margin-bottom: 30px; }
    .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); background: #fdfbf7; border-bottom: 1px solid var(--border-color); text-align: center; padding: 10px 0; font-weight: bold; font-size: 0.9rem; color: var(--text-light); }
    .weekdays div:first-child { color: var(--primary-red); } .weekdays div:last-child { color: var(--primary-blue); }
    .days { display: grid; grid-template-columns: repeat(7, 1fr); grid-auto-rows: minmax(100px, auto); }
    .day-cell { border-right: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); padding: 8px; cursor: pointer; min-height: 100px; }
    .day-cell:nth-child(7n) { border-right: none; } .day-cell:hover { background-color: #f9f9f9; }
    .day-number { font-size: 0.9rem; margin-bottom: 5px; }
    .day-cell:nth-child(7n+1) .day-number { color: var(--primary-red); } .day-cell:nth-child(7n) .day-number { color: var(--primary-blue); }
